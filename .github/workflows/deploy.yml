name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build once without enabling automatic deployments
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-langolation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site output
        run: |
          sh deploy/check-site.sh

  deploy:
    needs: validate
    if: ${{ vars.DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://alexanderbuysse.be/langolation/
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp deploy/web0152_known_hosts ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p 7685 \
            -o IdentitiesOnly=yes \
            u183069p267156@web0152.zxcs.be
